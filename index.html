<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RutaMóvil · Microfinanzas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-deep: #050811;
      --glass-surface: rgba(16, 23, 39, 0.62);
      --glass-elevated: rgba(26, 36, 58, 0.78);
      --glass-input: rgba(8, 13, 24, 0.72);
      --border-glass: rgba(255, 255, 255, 0.13);
      --border-specular: rgba(255, 255, 255, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.16), transparent 42%),
        radial-gradient(circle at 88% 16%, rgba(16, 185, 129, 0.13), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(99, 102, 241, 0.12), transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .glass-card {
      background: var(--glass-surface);
      -webkit-backdrop-filter: blur(14px) saturate(145%);
      backdrop-filter: blur(14px) saturate(145%);
      border: 1px solid var(--border-glass);
      border-top-color: var(--border-specular);
      border-radius: var(--radius-xl);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .glass-pill {
      background: var(--glass-elevated);
      border: 1px solid var(--border-glass);
      border-top-color: var(--border-specular);
      border-radius: 999px;
    }

    /* ================= LOGIN SCREEN ================= */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 26px 22px;
    }

    .login-logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(16, 185, 129, 0.25));
      border: 1px solid var(--border-specular);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 14px;
    }

    .login-box h1 {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 35%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-box p {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin: 4px 0 20px;
    }

    /* ================= MAIN APP ================= */
    #appScreen {
      display: none;
      padding: 14px 14px 115px;
      max-width: 540px;
      margin: 0 auto;
    }

    header {
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .brand span {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gps-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-amber);
    }
    .dot.ok { background: var(--accent-emerald); }
    .dot.err { background: var(--accent-rose); }

    .gps-detail {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.28);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Tabs de Navegación (Ruta vs Mapa) */
    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px;
      margin-bottom: 14px;
      border-radius: var(--radius-lg);
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 13px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.4);
      color: #e0f2fe;
    }

    /* KPIs */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-box {
      padding: 10px 6px;
      text-align: center;
      border-radius: var(--radius-lg);
    }

    .stat-box span {
      display: block;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .stat-box small {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* Toolbar */
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn-glass {
      background: var(--glass-elevated);
      border: 1px solid var(--border-glass);
      border-top-color: var(--border-specular);
      color: var(--text-main);
      padding: 11px 12px;
      border-radius: var(--radius-lg);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-glass:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.32), rgba(14, 165, 233, 0.18));
      border-color: rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
    }

    .btn-emerald {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.32), rgba(5, 150, 105, 0.18));
      border-color: rgba(16, 185, 129, 0.45);
      color: #d1fae5;
    }

    /* Mapa */
    #mapView {
      display: none;
    }

    .map-wrapper {
      padding: 10px;
      margin-bottom: 14px;
    }

    #map {
      width: 100%;
      height: 390px;
      border-radius: var(--radius-lg);
      z-index: 1;
      background: #0b1120;
    }

    /* Lista de Visitas */
    .visit-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .visit-card {
      padding: 15px;
    }

    .visit-card.completed {
      border-color: rgba(16, 185, 129, 0.38);
    }

    .visit-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .visit-order {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.45);
      font-size: 0.75rem;
      font-weight: 700;
      color: #7dd3fc;
      margin-right: 5px;
    }

    .visit-title {
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      font-size: 0.66rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .tag-emergente {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .tag-done {
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #a7f3d0;
    }

    .visit-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .reorder-controls {
      display: flex;
      gap: 4px;
    }

    .btn-mini {
      width: 29px;
      height: 29px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .photo-thumb {
      aspect-ratio: 1;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .visit-actions {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 0.8fr;
      gap: 6px;
      margin-top: 11px;
    }

    /* Bottom Dock */
    .bottom-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 540px;
      padding: 10px;
      display: flex;
      gap: 8px;
      z-index: 50;
    }

    .bottom-dock button { flex: 1; }

    /* Modales */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 14, 0.78);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      padding: 18px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 { font-size: 1.05rem; }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-size: 0.77rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 11px 13px;
      border-radius: var(--radius-md);
      background: var(--glass-input);
      border: 1px solid var(--border-glass);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .photo-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .photo-grid-modal {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .photo-slot {
      aspect-ratio: 4/3;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.38);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: center;
      padding: 4px;
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slot-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(5, 8, 17, 0.78);
      color: #7dd3fc;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .slot-del {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(244, 63, 94, 0.85);
      color: #fff;
      border: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      z-index: 250;
      display: none;
      max-width: 92%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="toast" class="glass-pill toast"></div>

  <!-- ================= PANTALLA DE LOGIN ================= -->
  <section id="loginScreen">
    <div class="glass-card login-box">
      <div class="login-logo">📍</div>
      <h1>RutaMóvil</h1>
      <p>Microfinanciera Mano Amigo · Control de Campo</p>

      <div class="form-group">
        <label>Nombre del Asesor</label>
        <input id="loginNombre" class="form-control" type="text" placeholder="Ej. Gilmar Zacarías" />
      </div>
      <div class="form-group">
        <label>Código de Asesor / Usuario</label>
        <input id="loginCodigo" class="form-control" type="text" placeholder="Ej. AS-04" />
      </div>
      <div class="form-group">
        <label>Zona o Ruta Asignada</label>
        <input id="loginRuta" class="form-control" type="text" placeholder="Ej. Ruta Centro - Chitatul" />
      </div>

      <button class="btn-glass btn-primary" style="width:100%;margin-top:8px;padding:13px;" onclick="iniciarSesion()">
        Iniciar Jornada →
      </button>
    </div>
  </section>

  <!-- ================= APLICACIÓN PRINCIPAL ================= -->
  <div id="appScreen">
    <header class="glass-card">
      <div class="header-top">
        <div class="brand">
          <h2 id="hdrAsesor">Asesor</h2>
          <span id="hdrRuta">Ruta asignada</span>
        </div>
        <div class="header-actions">
          <button class="glass-pill gps-badge" onclick="obtenerUbicacion()">
            <span id="gpsDot" class="dot"></span>
            <span id="gpsStatusText">GPS...</span>
          </button>
          <button class="btn-mini" title="Cerrar sesión" onclick="cerrarSesion()">⎋</button>
        </div>
      </div>
      <div class="gps-detail">
        <span id="gpsCoordsText">Buscando señal de ubicación...</span>
        <span id="gpsAccuracyText" style="color:#7dd3fc;font-weight:600;">--</span>
      </div>
    </header>

    <!-- Selector Ruta / Mapa -->
    <div class="glass-card nav-tabs">
      <button id="tabBtnRuta" class="tab-btn active" onclick="cambiarVista('ruta')">📋 Lista de Ruta</button>
      <button id="tabBtnMapa" class="tab-btn" onclick="cambiarVista('mapa')">🗺️ Mapa en Vivo</button>
    </div>

    <!-- KPIs incluyendo contador real de fotos del día -->
    <div class="stats-row">
      <div class="glass-card stat-box">
        <span id="statTotal">0</span>
        <small>Clientes</small>
      </div>
      <div class="glass-card stat-box">
        <span id="statDone" style="color:#6ee7b7;">0</span>
        <small>Visitados</small>
      </div>
      <div class="glass-card stat-box">
        <span id="statPending" style="color:#fde68a;">0</span>
        <small>Pendientes</small>
      </div>
      <div class="glass-card stat-box">
        <span id="statPhotos" style="color:#7dd3fc;">0</span>
        <small>Fotos hoy</small>
      </div>
    </div>

    <!-- VISTA LISTA DE RUTA -->
    <div id="rutaView">
      <div class="toolbar">
        <button class="btn-glass btn-primary" onclick="abrirModalNuevaVisita()">+ Visita Emergente</button>
        <button class="btn-glass" onclick="ordenarRutaAutomatica()">⚡ Ordenar por GPS</button>
      </div>
      <main id="visitList" class="visit-list"></main>
    </div>

    <!-- VISTA MAPA -->
    <div id="mapView">
      <div class="glass-card map-wrapper">
        <div id="map"></div>
      </div>
      <button class="btn-glass btn-primary" style="width:100%;" onclick="centrarMapaEnAsesor()">
        🎯 Centrar en mi ubicación actual
      </button>
    </div>
  </div>

  <!-- Barra inferior flotante -->
  <div id="bottomDock" class="glass-card bottom-dock" style="display:none;">
    <button class="btn-glass" onclick="reiniciarDia()">Limpiar Día</button>
    <button class="btn-glass btn-emerald" onclick="generarReportePDF()">📄 Reporte PDF</button>
  </div>

  <!-- MODAL NUEVA VISITA -->
  <div id="modalNueva" class="modal-backdrop">
    <div class="glass-card modal-sheet">
      <div class="modal-header">
        <h3>Registrar Cliente en Ruta</h3>
        <button class="btn-mini" onclick="cerrarModal('modalNueva')">✕</button>
      </div>
      <div class="form-group">
        <label>Nombre Completo del Cliente</label>
        <input id="inpCliente" class="form-control" type="text" placeholder="Ej. Juana Morales" />
      </div>
      <div class="form-group">
        <label>Dirección / Referencia</label>
        <input id="inpDireccion" class="form-control" type="text" placeholder="Ej. Zona 2, frente a tienda" />
      </div>
      <div class="form-group">
        <label>Tipo de Gestión</label>
        <select id="inpTipo" class="form-control">
          <option value="Cobro Diario">Cobro Diario</option>
          <option value="Verificación de Crédito">Verificación de Crédito</option>
          <option value="Visita Emergente">Visita Emergente</option>
          <option value="Renovación">Renovación</option>
        </select>
      </div>
      <button class="btn-glass btn-primary" style="width:100%;margin-top:6px;" onclick="guardarNuevaVisita()">
        Agregar a la Ruta
      </button>
    </div>
  </div>

  <!-- MODAL CHECK-IN Y 4 FOTOS (AUTOGUARDADO POR RANURA) -->
  <div id="modalDoc" class="modal-backdrop">
    <div class="glass-card modal-sheet">
      <div class="modal-header">
        <h3 id="docTitulo">Documentar Visita</h3>
        <button class="btn-mini" onclick="cerrarModalDoc()">✕</button>
      </div>
      <p id="docSubtitulo" style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;"></p>

      <div class="form-group">
        <label>Observaciones de Gestión</label>
        <textarea id="inpNotas" class="form-control" rows="2" placeholder="Ej. Pago recibido, negocio abierto..."></textarea>
      </div>

      <label style="font-size:0.77rem;color:var(--text-muted);display:block;margin-bottom:6px;">
        Evidencia Fotográfica (4 fotos · Se guardan automáticamente al cargar)
      </label>

      <div class="photo-toolbar">
        <button type="button" class="btn-glass btn-primary" style="flex:1;padding:9px;font-size:0.78rem;" onclick="abrirSelectorMultiple()">
          🖼️ Subir varias (Galería)
        </button>
      </div>

      <div class="photo-grid-modal" id="photoGridModal"></div>

      <!-- Input individual (cámara o galería) -->
      <input id="singlePhotoInput" type="file" accept="image/*" style="display:none;" onchange="procesarFotoIndividual(event)" />
      <!-- Input múltiple (hasta 4 fotos a la vez) -->
      <input id="multiPhotoInput" type="file" accept="image/*" multiple style="display:none;" onchange="procesarFotosMultiples(event)" />

      <button id="btnSaveDoc" class="btn-glass btn-emerald" style="width:100%;margin-top:8px;" onclick="completarVisita()">
        ✓ Confirmar Visita y Check-in GPS
      </button>
    </div>
  </div>

  <script>
    const SESSION_KEY = 'rutamovil_session_v4';
    const META_KEY = 'rutamovil_visitas_v4';
    const ACTIVE_DRAFT_KEY = 'rutamovil_active_modal_v4';
    const DB_NAME = 'RutaMovilHighCapDB';
    const STORE_NAME = 'fotos_evidencia';

    let db = null;
    let sessionData = null;
    let currentCoords = null;
    let activeVisitId = null;
    let activePhotoSlot = 0;

    // URLs temporales solo para el modal abierto y miniaturas visibles
    let modalSlotUrls = [null, null, null, null];
    let thumbUrlsCache = {}; // { [visitId]: [url0, url1, url2, url3] }

    let mapInstance = null;
    let userMarker = null;
    let routeLayerGroup = null;

    let visitas = cargarVisitasMeta();

    // =========================================================
    // 1. BASE DE DATOS INDEXEDDB (SOPORTA ~160+ FOTOS AL DÍA)
    // =========================================================
    function abrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => {
          db = req.result;
          resolve(db);
        };
        req.onerror = () => reject(req.error);
      });
    }

    function guardarBlobIDB(key, blob) {
      if (!db) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        if (blob) store.put(blob, key);
        else store.delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function leerBlobIDB(key) {
      if (!db) return Promise.resolve(null);
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

    function borrarFotosDeVisitaIDB(visitId) {
      return Promise.all([0, 1, 2, 3].map(i => guardarBlobIDB(`${visitId}_${i}`, null)));

    function limpiarTodaBaseIDB() {
      if (!db) return Promise.resolve();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
      });
    }

    // =========================================================
    // 4. GPS CON DOBLE INTENTO (SATÉLITE + FALLBACK RED)
    // =========================================================
    function obtenerUbicacion(silencioso = false) {
      const dot = document.getElementById('gpsDot');
      const status = document.getElementById('gpsStatusText');
      const coordsEl = document.getElementById('gpsCoordsText');
      const accEl = document.getElementById('gpsAccuracyText');

      if (!('geolocation' in navigator) || !window.isSecureContext) {
        dot.className = 'dot err';
        status.textContent = 'Sin GPS';
        coordsEl.textContent = 'Activa ubicación y abre la app en HTTPS.';
        return Promise.resolve(null);
      }

      dot.className = 'dot';
      status.textContent = 'Buscando...';

      const pedir = (alta, timeoutMs) =>
        new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: alta,
            timeout: timeoutMs,
            maximumAge: 20000
          });
        });

      return pedir(true, 5000)
        .catch(() => pedir(false, 7000))
        .then((pos) => {
          currentCoords = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            acc: Math.round(pos.coords.accuracy)
          };
          dot.className = 'dot ok';
          status.textContent = 'GPS Activo';
          coordsEl.textContent = `${currentCoords.lat.toFixed(5)}, ${currentCoords.lng.toFixed(5)}`;
          accEl.textContent = `±${currentCoords.acc}m`;
          actualizarMapa();
          if (!silencioso) mostrarToast('Ubicación GPS actualizada');
          return currentCoords;
        })
        .catch((err) => {
          dot.className = 'dot err';
          status.textContent = 'Error GPS';
          let msg = 'No se pudo obtener señal GPS.';
          if (err.code === 1) msg = 'Permiso de ubicación denegado.';
          if (err.code === 2) msg = 'Señal GPS no disponible.';
          if (err.code === 3) msg = 'Tiempo agotado buscando ubicación.';
          coordsEl.textContent = msg;
          accEl.textContent = `Err ${err.code || ''}`;
          if (!silencioso) mostrarToast(msg);
          return null;
        });
    }

    function inicializarMapa() {
      if (!window.L) return;
      if (!mapInstance) {
        const center = currentCoords ? [currentCoords.lat, currentCoords.lng] : [15.0305, -91.1489];
        mapInstance = L.map('map').setView(center, 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(mapInstance);
        routeLayerGroup = L.layerGroup().addTo(mapInstance);
      }
      setTimeout(() => {
        mapInstance.invalidateSize();
        actualizarMapa();
      }, 150);
    }

    function actualizarMapa() {
      if (!mapInstance || !routeLayerGroup) return;
      routeLayerGroup.clearLayers();

      const puntosRuta = [];

      if (currentCoords) {
        const asesorIcon = L.divIcon({
          className: '',
          html: `<div style="width:16px;height:16px;border-radius:50%;background:#38bdf8;border:3px solid #fff;box-shadow:0 0 12px #38bdf8;"></div>`,
          iconSize: [16, 16]
        });
        userMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: asesorIcon })
          .bindPopup(`<b>Tu ubicación actual</b><br>Precisión: ±${currentCoords.acc}m`)
          .addTo(routeLayerGroup);
        puntosRuta.push([currentCoords.lat, currentCoords.lng]);
      }

      visitas.forEach((v, idx) => {
        if (v.lat && v.lng) {
          const color = v.completada ? '#10b981' : '#f59e0b';
          const pinIcon = L.divIcon({
            className: '',
            html: `<div style="width:24px;height:24px;border-radius:50%;background:${color};color:#050811;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">${idx + 1}</div>`,
            iconSize: [24, 24]
          });
          L.marker([v.lat, v.lng], { icon: pinIcon })
            .bindPopup(`<b>${idx + 1}. ${v.cliente}</b><br>${v.direccion}<br>${v.completada ? '✓ Completada' : 'Pendiente'}`)
            .addTo(routeLayerGroup);
          puntosRuta.push([v.lat, v.lng]);
        }
      });

      if (puntosRuta.length > 1) {
        L.polyline(puntosRuta, { color: '#38bdf8', weight: 3, opacity: 0.65, dashArray: '6, 8' }).addTo(routeLayerGroup);
      }
    }

    function centrarMapaEnAsesor() {
      if (!currentCoords) {
        obtenerUbicacion();
        return;
      }
      if (mapInstance) {
        mapInstance.setView([currentCoords.lat, currentCoords.lng], 16);
      }
    }

    function moverVisita(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= visitas.length) return;
      const tmp = visitas[index];
      visitas[index] = visitas[target];
      visitas[target] = tmp;
      guardarVisitasMeta();
      renderVisitas();
      actualizarMapa();
    }

    async function ordenarRutaAutomatica() {
      const coords = currentCoords || await obtenerUbicacion(true);
      if (!coords) {
        mostrarToast('Activa el GPS para ordenar por cercanía.');
        return;
      }
      const dist = (a) => {
        if (!a.lat || !a.lng) return 999999;
        return (a.lat - coords.lat) ** 2 + (a.lng - coords.lng) ** 2;
      };
      const pendientes = visitas.filter(v => !v.completada).sort((a, b) => dist(a) - dist(b));
      const completadas = visitas.filter(v => v.completada);
      visitas = [...completadas, ...pendientes];
      guardarVisitasMeta();
      renderVisitas();
      actualizarMapa();
      mostrarToast('Ruta ordenada por cercanía GPS');
    }

    // Comprime a JPEG ligero (~50KB) usando createImageBitmap o Image con limpieza inmediata
    function comprimirArchivoAJpegBlob(file) {
      return new Promise((resolve, reject) => {
        const tempUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          URL.revokeObjectURL(tempUrl);
          const MAX_SIDE = 600;
          const w = img.width || MAX_SIDE;
          const h = img.height || MAX_SIDE;
          const scale = Math.min(1, MAX_SIDE / Math.max(w, h));

          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((blob) => {
            canvas.width = 0;
            canvas.height = 0;
            if (blob) resolve(blob);
            else reject(new Error('No se pudo comprimir'));
          }, 'image/jpeg', 0.60);
        };

        img.onerror = () => {
          URL.revokeObjectURL(tempUrl);
          reject(new Error('Archivo de imagen inválido'));
        };

        img.src = tempUrl;
      });
    }

    // Guarda INMEDIATAMENTE en IndexedDB apenas se carga cada foto
    async function guardarFotoEnRanura(slotIndex, file) {
      const v = visitas.find(item => item.id === activeVisitId);
      if (!v) return;

      const blob = await comprimirArchivoAJpegBlob(file);
      await guardarBlobIDB(`${v.id}_${slotIndex}`, blob);

      if (!v.fotosFlags) v.fotosFlags = [false, false, false, false];
      v.fotosFlags[slotIndex] = true;
      guardarVisitasMeta();

      if (modalSlotUrls[slotIndex]) URL.revokeObjectURL(modalSlotUrls[slotIndex]);
      modalSlotUrls[slotIndex] = URL.createObjectURL(blob);

      await cargarMiniaturasVisita(v);
      renderPhotoGridModal();
      renderVisitas();
    }

    async function procesarFotoIndividual(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      mostrarToast(`Guardando foto ${activePhotoSlot + 1}...`);
      try {
        await guardarFotoEnRanura(activePhotoSlot, file);
        mostrarToast(`Foto ${activePhotoSlot + 1} guardada`);
      } catch (e) {
        mostrarToast('Error al procesar la foto.');
      }
    }

    async function procesarFotosMultiples(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const v = visitas.find(item => item.id === activeVisitId);
      if (!v) return;
      const flags = v.fotosFlags || [false, false, false, false];

      let fileIdx = 0;
      for (let slot = 0; slot < 4 && fileIdx < files.length; slot++) {
        if (!flags[slot]) {
          mostrarToast(`Procesando foto ${slot + 1} de 4...`);
          try {
            await guardarFotoEnRanura(slot, files[fileIdx]);
          } catch (e) {}
          fileIdx++;
        }
      }
      // Si todas las ranuras estaban llenas, sobrescribe desde la 0
      if (fileIdx === 0) {
        for (let slot = 0; slot < Math.min(4, files.length); slot++) {
          mostrarToast(`Actualizando foto ${slot + 1}...`);
          try {
            await guardarFotoEnRanura(slot, files[slot]);
          } catch (e) {}
        }
      }
      mostrarToast('Fotos guardadas correctamente');
    }

    async function eliminarFotoRanura(event, slotIndex) {
      event.stopPropagation();
      const v = visitas.find(item => item.id === activeVisitId);
      if (!v) return;

      await guardarBlobIDB(`${v.id}_${slotIndex}`, null);
      if (!v.fotosFlags) v.fotosFlags = [false, false, false, false];
      v.fotosFlags[slotIndex] = false;
      guardarVisitasMeta();

      if (modalSlotUrls[slotIndex]) {
        URL.revokeObjectURL(modalSlotUrls[slotIndex]);
        modalSlotUrls[slotIndex] = null;
      }

      await cargarMiniaturasVisita(v);
      renderPhotoGridModal();
      renderVisitas();
      mostrarToast(`Foto ${slotIndex + 1} eliminada`);
    }

    async function completarVisita() {
      const v = visitas.find(item => item.id === activeVisitId);
      if (!v) return;

      const btn = document.getElementById('btnSaveDoc');
      btn.disabled = true;
      btn.textContent = 'Registrando GPS...';

      try {
        const coords = currentCoords || await obtenerUbicacion(true);
        const horaStr = new Date().toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' });

        v.completada = true;
        v.notas = document.getElementById('inpNotas').value.trim();
        v.horaCheckin = horaStr;
        if (coords) {
          v.lat = coords.lat;
          v.lng = coords.lng;
          v.coordsCheckin = `${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}`;
        }

        guardarVisitasMeta();
        actualizarMapa();
        cerrarModalDoc();
        mostrarToast('Check-in completado');
      } finally {
        btn.disabled = false;
        btn.textContent = '✓ Confirmar Visita y Check-in GPS';
      }
    }

    async function eliminarVisita(id) {
      if (!confirm('¿Eliminar esta visita y sus fotos?')) return;
      await borrarFotosDeVisitaIDB(id);
      liberarUrlsArray(thumbUrlsCache[id]);
      delete thumbUrlsCache[id];
      visitas = visitas.filter(v => v.id !== id);
      guardarVisitasMeta();
      renderVisitas();
      actualizarMapa();
    }

    async function reiniciarDia() {
      if (!confirm('¿Limpiar TODAS las visitas y fotos almacenadas hoy?')) return;
      await limpiarTodaBaseIDB();
      Object.values(thumbUrlsCache).forEach(liberarUrlsArray);
      thumbUrlsCache = {};
      visitas = [];
      guardarVisitasMeta();
      renderVisitas();
      actualizarMapa();
      mostrarToast('Jornada limpia');
    }

    // =========================================================
    // 8. EXPORTACIÓN PDF STREAMING (SIN SATURAR RAM CON 160 FOTOS)
    // =========================================================
    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function generarReportePDF() {
      if (!window.jspdf) {
        mostrarToast('Librería PDF cargando, intenta en un segundo.');
        return;
      }
      mostrarToast('Generando reporte PDF, espera...');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const fecha = new Date().toLocaleDateString('es-GT');

      doc.setFontSize(14);
      doc.text('REPORTE DIARIO DE RUTA - MICROFINANCIERA MANO AMIGO', 14, 16);
      doc.setFontSize(9.5);
      const asesorInfo = sessionData ? `${sessionData.nombre} (${sessionData.codigo}) · Ruta: ${sessionData.ruta}` : 'Asesor de Campo';
      doc.text(`Asesor: ${asesorInfo}`, 14, 23);
      doc.text(`Fecha: ${fecha}   |   Clientes: ${visitas.length}`, 14, 29);

      let y = 38;
      for (let idx = 0; idx < visitas.length; idx++) {
        const v = visitas[idx];
        if (y > 232) {
          doc.addPage();
          y = 18;
        }

        doc.setFontSize(10.5);
        doc.setFont(undefined, 'bold');
        doc.text(`${idx + 1}. ${v.cliente} [${v.completada ? 'VISITADO' : 'PENDIENTE'}]`, 14, y);
        y += 5;

        doc.setFont(undefined, 'normal');
        doc.setFontSize(8.8);
        doc.text(`Gestión: ${v.tipo} | Dirección: ${v.direccion}`, 14, y);
        y += 4.5;
        doc.text(`Check-in: ${v.horaCheckin || 'N/A'} | GPS: ${v.coordsCheckin || 'Sin coordenadas'}`, 14, y);
        y += 4.5;
        if (v.notas) {
          doc.text(`Obs: ${v.notas}`, 14, y);
          y += 4.5;
        }

        const flags = v.fotosFlags || [false, false, false, false];
        if (flags.some(Boolean)) {
          let xImg = 14;
          for (let i = 0; i < 4; i++) {
            if (flags[i]) {
              const blob = await leerBlobIDB(`${v.id}_${i}`);
              if (blob) {
                try {
                  const b64 = await blobToDataURL(blob);
                  doc.addImage(b64, 'JPEG', xImg, y, 42, 31);
                  xImg += 46;
                } catch (e) {}
              }
            }
          }
          y += 36;
        } else {
          y += 4;
        }
      }

      const cod = sessionData ? sessionData.codigo : 'RUTA';
      doc.save(`Reporte_${cod}_${fecha.replace(/\//g, '-')}.pdf`);
      mostrarToast('Reporte PDF descargado');
    }

    // =========================================================
    // ARRANQUE Y RECUPERACIÓN TRAS POSIBLE REINICIO DE CÁMARA
    // =========================================================
    (async function init() {
      await abrirDB().catch(() => {});
      sessionData = cargarSesion();

      if (sessionData) {
        mostrarApp();
        await hidratarTodasLasMiniaturas();

        // Si el navegador recargó mientras estabas en el modal de fotos, lo reabre intacto
        const draftVisitId = localStorage.getItem(ACTIVE_DRAFT_KEY);
        if (draftVisitId && visitas.some(v => v.id === draftVisitId)) {
          abrirModalDoc(draftVisitId);
        }
      }
    })();
  </script>
