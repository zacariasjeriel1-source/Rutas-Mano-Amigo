<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano Amiga - GPS con Fotos y Motos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-600 text-white rounded-2xl shadow mb-3 text-xl">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-900">Mano Amiga</h1>
                <p class="text-xs text-slate-500">Control de Flota y Evidencias</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">PIN / Clave de Acceso</label>
                    <input type="password" id="login-pass" maxlength="6" placeholder="••••" class="w-full text-center text-xl tracking-widest px-3 py-2.5 rounded-xl border bg-slate-50 font-bold">
                    <p class="text-[10px] text-slate-400 mt-1 text-center">Admin: 1596 | Asesor 1: 1346 | Asesor 2: 7946</p>
                </div>
                <button onclick="intentarLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow transition text-sm">
                    Iniciar Sesión
                </button>
            </div>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div id="app-container" class="min-h-screen flex flex-col hidden">
        <header class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shadow">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 p-2 rounded-lg"><i class="fa-solid fa-satellite-dish"></i></div>
                <h2 class="font-bold text-sm" id="header-title">Control Diario</h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="abrirModalEvidencias()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Bitácora</button>
                <span id="user-badge" class="bg-slate-800 text-emerald-400 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700"></span>
                <button onclick="cerrarSesion()" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row">
            <!-- PANEL LATERAL -->
            <aside class="w-full lg:w-[400px] bg-white border-r flex flex-col z-20 shadow">
                <div id="admin-selector-box" class="p-3 bg-slate-50 border-b hidden space-y-2">
                    <label class="block text-[11px] font-semibold text-slate-600">Monitorear Asesor:</label>
                    <select id="select-vista-asesor" onchange="cambiarVistaAdmin()" class="w-full text-xs p-2 rounded border bg-white font-medium">
                        <option value="todos">🌍 Ver Todos</option>
                    </select>
                </div>

                <div class="p-4 border-b space-y-3" id="admin-controls-box">
                    <h3 class="font-bold text-xs uppercase text-slate-700"><i class="fa-solid fa-route text-emerald-600"></i> Asignar Coordenadas (Ruta)</h3>
                    <textarea id="input-coordenadas" rows="3" class="w-full text-xs p-2 rounded border font-mono bg-slate-50" placeholder="14.9625, -91.1862, Cliente A&#10;14.9650, -91.1890, Cliente B"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="optimizarYGuardarRuta()" class="bg-emerald-600 text-white font-semibold py-2 rounded text-xs">Asignar Ruta</button>
                        <button onclick="limpiarRutaCompleta()" class="bg-red-600 text-white font-semibold py-2 rounded text-xs">Limpiar Ruta</button>
                    </div>
                </div>

                <div id="asesor-emergente-box" class="p-3 bg-emerald-50 border-b hidden">
                    <button onclick="abrirModalVisitaEmergente()" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded text-xs shadow">
                        ⚡ Registrar Visita Emergente
                    </button>
                </div>

                <div class="px-4 py-2 bg-slate-900 text-white text-xs">
                    <div class="flex justify-between font-bold"><span class="text-slate-300">GPS En Vivo:</span> <span id="txt-ultima-act" class="text-emerald-400 font-mono">Activo</span></div>
                    <div class="font-mono text-[10px] text-slate-400" id="txt-coords-envivo">Esperando señal...</div>
                </div>

                <div class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50" id="lista-paradas"></div>
            </aside>

            <!-- MAPA -->
            <main class="flex-1 relative flex flex-col">
                <div class="absolute top-3 right-3 z-[400] bg-slate-900/90 text-white px-4 py-2 rounded-xl shadow border border-slate-700 flex items-center gap-4 text-xs">
                    <div><b>Vel:</b> <span id="waze-speed" class="text-emerald-400">0.0</span> km/h</div>
                    <button id="btn-gps-toggle" onclick="activarGPSReal()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold shadow">
                        Activar GPS
                    </button>
                </div>
                <div id="map" class="flex-1 w-full h-[450px] lg:h-full z-10"></div>
            </main>
        </div>
    </div>

    <!-- MODAL VISITA -->
    <div id="modal-visita" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-80 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 space-y-3">
            <h3 class="font-bold text-sm text-slate-900"><i class="fa-solid fa-camera text-emerald-600"></i> Registrar Visita con Fotos</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Fotos (Máx. 4)</label>
                <input type="file" id="input-fotos" accept="image/*" multiple class="w-full text-xs border rounded p-2 file:bg-emerald-50 file:text-emerald-700 file:border-0 file:py-1 file:px-2 file:rounded">
            </div>
            <textarea id="input-avance" rows="2" class="w-full text-xs p-2.5 rounded border" placeholder="Observaciones de la visita..."></textarea>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="guardarVisitaExitosa()" class="bg-emerald-600 text-white font-semibold py-2.5 rounded text-xs shadow">Guardar Visita</button>
                <button onclick="marcarIncidenciaAusente()" class="bg-amber-500 text-white font-semibold py-2.5 rounded text-xs shadow">Ausente ⚠</button>
            </div>
        </div>
    </div>

    <!-- MODAL EMERGENTE -->
    <div id="modal-emergente" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-80 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 space-y-3">
            <h3 class="font-bold text-sm text-slate-900"><i class="fa-solid fa-bolt text-blue-600"></i> Visita Emergente con Fotos</h3>
            <input type="text" id="input-emergente-nombre" placeholder="Nombre del Cliente" class="w-full text-xs p-2.5 rounded border">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Fotos (Máx. 4)</label>
                <input type="file" id="input-fotos-emergente" accept="image/*" multiple class="w-full text-xs border rounded p-2 file:bg-blue-50 file:text-blue-700 file:border-0 file:py-1 file:px-2 file:rounded">
            </div>
            <textarea id="input-emergente-avance" rows="2" class="w-full text-xs p-2.5 rounded border" placeholder="Motivo de la emergencia..."></textarea>
            <button onclick="guardarVisitaEmergenteReal()" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded text-xs shadow">Guardar Emergencia</button>
        </div>
    </div>

    <!-- MODAL BITÁCORA -->
    <div id="modal-evidencias" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-80 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full p-5 space-y-3 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-900">Bitácora y Fotos de Hoy</h3>
                <button onclick="cerrarModalEvidencias()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="contenedor-grid-evidencias" class="flex-1 overflow-y-auto space-y-3 p-1 text-xs"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lcqztstpefwlwrmkerau.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_YOLr5vJUSRUE13Ud403_RA_xmuR9FJQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const AGENCIA_CENTRAL = { lat: 15.032100742090686, lng: -91.15299656594703 };

        let usuarioActual = null, rolActual = null, vistaAdminSeleccionada = "todos";
        let map = null, marcadoresAsesores = {}, polylinesAsesores = [];
        let watchId = null, gpsIntervalLoop = null, paradasVisitandoIndex = null;
        const COLORES_ASESORES = ["#2563eb", "#10b981", "#8b5cf6", "#f59e0b", "#ec4899", "#06b6d4"];

        const baseInicial = {
            "1596": { id: "1596", nombre: "Administrador Central", rol: "admin", color: "#1e293b", lat: AGENCIA_CENTRAL.lat, lng: AGENCIA_CENTRAL.lng, historial: [] },
            "4862": { id: "4862", nombre: "Gestor de Cartera", rol: "admin", color: "#0f172a", lat: AGENCIA_CENTRAL.lat, lng: AGENCIA_CENTRAL.lng, historial: [] },
            "1346": { id: "1346", nombre: "Asesor 1", rol: "asesor", cerrado: false, color: "#2563eb", lat: null, lng: null, historial: [], puntos: [], emergentes: [] },
            "7946": { id: "7946", nombre: "Asesor 2", rol: "asesor", cerrado: false, color: "#10b981", lat: null, lng: null, historial: [], puntos: [], emergentes: [] }
        };

        let asesoresDB = baseInicial;

        function limpiarDatosAntiguosDiarios() {
            let fechaHoy = new Date().toLocaleDateString();
            Object.keys(asesoresDB).forEach(pin => {
                let usr = asesoresDB[pin];
                if (usr && usr.rol === 'asesor') {
                    if (usr.historial) {
                        usr.historial = usr.historial.filter(item => Array.isArray(item) && item[2] === fechaHoy);
                    }
                    if (usr.emergentes) {
                        usr.emergentes = usr.emergentes.filter(em => em.fecha && em.fecha.startsWith(fechaHoy));
                    }
                }
            });
        }

        async function sincronizarDesdeSupabase() {
            try {
                let { data } = await supabaseClient.from('sistema_flota').select('*').eq('id', 'config_global').maybeSingle();
                if (data && data.contenido) {
                    asesoresDB = data.contenido;
                    limpiarDatosAntiguosDiarios();
                } else {
                    await supabaseClient.from('sistema_flota').upsert({ id: 'config_global', contenido: baseInicial });
                }
            } catch (e) { console.warn("Modo local activo"); }
            if (usuarioActual && asesoresDB[usuarioActual.id]) usuarioActual = asesoresDB[usuarioActual.id];
            if (rolActual === "admin") poblarSelectVistaAdmin();
            renderizarListaParadas();
            actualizarDibujoRutaMapa();
        }

        iniciarEscuchaSupabaseRealtime();
        function iniciarEscuchaSupabaseRealtime() {
            sincronizarDesdeSupabase();
            supabaseClient.channel('public:sistema_flota').on('postgres_changes', { event: '*', schema: 'public', table: 'sistema_flota' }, payload => {
                if (payload.new && payload.new.contenido) {
                    asesoresDB = payload.new.contenido;
                    limpiarDatosAntiguosDiarios();
                    if (usuarioActual && asesoresDB[usuarioActual.id]) usuarioActual = asesoresDB[usuarioActual.id];
                    if (rolActual === "admin") poblarSelectVistaAdmin();
                    renderizarListaParadas();
                    actualizarDibujoRutaMapa();
                }
            }).subscribe();
        }

        async function guardarEnSupabase() {
            try {
                await supabaseClient.from('sistema_flota').upsert({ id: 'config_global', contenido: asesoresDB });
            } catch (e) { console.warn(e); }
        }

        function intentarLogin() {
            let pass = document.getElementById("login-pass").value.trim();
            let cuenta = asesoresDB[pass] || baseInicial[pass];
            if (!cuenta) { 
                alert("PIN incorrecto. Usa: 1346 (Asesor) o 1596 (Admin)"); 
                return; 
            }
            rolActual = cuenta.rol;
            usuarioActual = cuenta;
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("app-container").classList.remove("hidden");
            
            document.getElementById("user-badge").innerText = `${cuenta.nombre} (${rolActual.toUpperCase()})`;

            if (rolActual === "admin") {
                document.getElementById("admin-controls-box").style.display = "block";
                document.getElementById("admin-selector-box").style.display = "block";
                poblarSelectVistaAdmin();
            } else {
                document.getElementById("admin-controls-box").style.display = "none";
                document.getElementById("admin-selector-box").style.display = "none";
                document.getElementById("asesor-emergente-box").style.display = "block";
            }
            
            setTimeout(() => { 
                inicializarMapaLeaflet(); 
                renderizarListaParadas(); 
                if (rolActual === "asesor") activarGPSReal(); 
            }, 200);

            sincronizarDesdeSupabase();
        }

        function cerrarSesion() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (gpsIntervalLoop) clearInterval(gpsIntervalLoop);
            document.getElementById("app-container").classList.add("hidden");
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("login-pass").value = "";
        }

        function poblarSelectVistaAdmin() {
            const select = document.getElementById("select-vista-asesor");
            select.innerHTML = `<option value="todos">🌍 Ver Todos</option>`;
            Object.keys(asesoresDB).forEach(pin => {
                let usr = asesoresDB[pin];
                if (usr && usr.rol === "asesor") {
                    select.innerHTML += `<option value="${pin}">${usr.nombre}</option>`;
                }
            });
        }

        function cambiarVistaAdmin() {
            vistaAdminSeleccionada = document.getElementById("select-vista-asesor").value;
            renderizarListaParadas();
            actualizarDibujoRutaMapa();
        }

        function inicializarMapaLeaflet() {
            if (!map) {
                map = L.map('map').setView([AGENCIA_CENTRAL.lat, AGENCIA_CENTRAL.lng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                L.marker([AGENCIA_CENTRAL.lat, AGENCIA_CENTRAL.lng]).addTo(map).bindPopup("Agencia Central");
            } else { map.invalidateSize(); }
            actualizarDibujoRutaMapa();
        }

        function actualizarDibujoRutaMapa() {
            if (!map) return;
            polylinesAsesores.forEach(l => map.removeLayer(l));
            polylinesAsesores = [];
            let fechaHoy = new Date().toLocaleDateString();

            let targetList = rolActual === "asesor" ? [usuarioActual] : (vistaAdminSeleccionada === "todos" ? Object.values(asesoresDB).filter(u => u.rol === "asesor") : [asesoresDB[vistaAdminSeleccionada]]);

            targetList.forEach((usr, idx) => {
                if (!usr) return;
                let col = usr.color || COLORES_ASESORES[idx % COLORES_ASESORES.length];

                if (usr.puntos) {
                    usr.puntos.forEach((p, i) => {
                        let m = L.marker([p.lat, p.lng]).addTo(map).bindPopup(`${i+1}. ${p.cliente} (${p.estado})`);
                        polylinesAsesores.push(m);
                    });
                }
                if (usr.emergentes) {
                    usr.emergentes.forEach(em => {
                        let m = L.marker([em.lat, em.lng]).addTo(map).bindPopup(`⚡ Emergencia: ${em.cliente}`);
                        polylinesAsesores.push(m);
                    });
                }
                if (usr.historial) {
                    let pts = usr.historial.filter(item => Array.isArray(item) && item[2] === fechaHoy).map(item => [item[0], item[1]]);
                    if (pts.length > 1) {
                        let line = L.polyline(pts, { color: col, weight: 4 }).addTo(map);
                        polylinesAsesores.push(line);
                    }
                }
                if (usr.lat && usr.lng) {
                    let iconoMoto = L.divIcon({
                        className: 'custom-moto-icon',
                        html: `<div style="background-color: ${col}; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 2px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.3); font-size: 14px;"><i class="fa-solid fa-motorcycle"></i></div>`,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17]
                    });

                    if (marcadoresAsesores[usr.id]) {
                        marcadoresAsesores[usr.id].setLatLng([usr.lat, usr.lng]);
                        marcadoresAsesores[usr.id].setIcon(iconoMoto);
                    } else {
                        marcadoresAsesores[usr.id] = L.marker([usr.lat, usr.lng], { icon: iconoMoto }).addTo(map).bindPopup(usr.nombre);
                    }
                }
            });
        }

        function activarGPSReal() {
            if (rolActual !== "asesor") return;
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    let lat = pos.coords.latitude, lng = pos.coords.longitude;
                    let fechaHoy = new Date().toLocaleDateString();
                    document.getElementById("waze-speed").innerText = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : "0.0";
                    usuarioActual.lat = lat; usuarioActual.lng = lng;
                    if (!usuarioActual.historial) usuarioActual.historial = [];
                    usuarioActual.historial.push([lat, lng, fechaHoy]);
                    asesoresDB[usuarioActual.id] = usuarioActual;
                    guardarEnSupabase();
                    actualizarDibujoRutaMapa();
                    document.getElementById("txt-coords-envivo").innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }, null, { enableHighAccuracy: true });
            }
        }

        async function optimizarYGuardarRuta() {
            let pin = rolActual === "admin" ? prompt("PIN del Asesor (ej. 1346):", "1346") : usuarioActual.id;
            if (!pin || !asesoresDB[pin]) return;
            let txt = document.getElementById("input-coordenadas").value.trim();
            let pts = [];
            txt.split("\n").forEach((l, i) => {
                let p = l.split(/[,/\t|]+/);
                if (p.length >= 2) pts.push({ lat: parseFloat(p[0]), lng: parseFloat(p[1]), cliente: p[2] ? p[2].trim() : `Cliente ${i+1}`, estado: "pendiente" });
            });
            if (pts.length === 0) { alert("Formato de coordenadas no válido"); return; }
            asesoresDB[pin].puntos = pts;
            await guardarEnSupabase();
            alert("Ruta asignada correctamente");
            document.getElementById("input-coordenadas").value = "";
            renderizarListaParadas();
            actualizarDibujoRutaMapa();
        }

        async function limpiarRutaCompleta() {
            let pin = rolActual === "admin" ? prompt("PIN del Asesor a limpiar ruta:", "1346") : usuarioActual.id;
            if (!pin || !asesoresDB[pin]) return;
            if (confirm("¿Estás seguro de limpiar la ruta de este asesor?")) {
                asesoresDB[pin].puntos = [];
                await guardarEnSupabase();
                renderizarListaParadas();
                actualizarDibujoRutaMapa();
                alert("Ruta limpiada");
            }
        }

        function renderizarListaParadas() {
            const contenedor = document.getElementById("lista-paradas");
            let target = rolActual === "admin" ? (vistaAdminSeleccionada === "todos" ? null : asesoresDB[vistaAdminSeleccionada]) : usuarioActual;
            
            if (!target) {
                contenedor.innerHTML = `<div class="p-3 text-xs text-slate-500">Selecciona un asesor en el panel superior para ver sus paradas.</div>`;
                return;
            }

            let html = "";
            (target.emergentes || []).forEach(em => {
                let imgHtml = "";
                (em.fotos || []).forEach(url => { imgHtml += `<img src="${url}" class="w-10 h-10 object-cover rounded border inline-block mr-1">`; });
                html += `<div class="p-2.5 bg-blue-50 border border-blue-200 rounded text-xs mb-2"><b>⚡ Emergencia: ${em.cliente}</b><br>${em.avance}<div class="mt-1">${imgHtml}</div></div>`;
            });
            (target.puntos || []).forEach((p, idx) => {
                let imgHtml = "";
                (p.fotos || []).forEach(url => { imgHtml += `<img src="${url}" class="w-10 h-10 object-cover rounded border inline-block mr-1">`; });
                html += `<div class="p-2.5 bg-white border rounded text-xs flex justify-between items-center mb-2 shadow-sm">
                    <div><b>${idx+1}. ${p.cliente}</b><br><span class="text-[10px] text-slate-500 font-semibold uppercase">${p.estado}</span><div class="mt-1">${imgHtml}</div></div>
                    ${rolActual === "asesor" && p.estado === "pendiente" ? `<button onclick="abrirModalVisita(${idx})" class="bg-emerald-600 text-white px-2.5 py-1.5 rounded font-bold text-[10px] shadow">Visita</button>` : ""}
                </div>`;
            });
            contenedor.innerHTML = html || `<div class="text-xs text-slate-400 p-2 text-center">Sin paradas asignadas para hoy.</div>`;
        }

        async function subirFotosAlCloud(inputElement) {
            let files = inputElement.files;
            let urlsFotos = [];
            if (!files || files.length === 0) return urlsFotos;

            for (let i = 0; i < Math.min(files.length, 4); i++) {
                let file = files[i];
                let fileName = `${usuarioActual.id}_${Date.now()}_${i}.jpg`;
                let { data, error } = await supabaseClient.storage.from('evidencias').upload(fileName, file);
                if (!error) {
                    let { data: publicUrlData } = supabaseClient.storage.from('evidencias').getPublicUrl(fileName);
                    if (publicUrlData) urlsFotos.push(publicUrlData.publicUrl);
                }
            }
            return urlsFotos;
        }

        function abrirModalVisita(i) { paradasVisitandoIndex = i; document.getElementById("input-fotos").value = ""; document.getElementById("input-avance").value = ""; document.getElementById("modal-visita").classList.remove("hidden"); }
        function cerrarModalVisita() { document.getElementById("modal-visita").classList.add("hidden"); }

        async function guardarVisitaExitosa() {
            if (paradasVisitandoIndex === null) return;
            let inputFiles = document.getElementById("input-fotos");
            let fotosUrls = await subirFotosAlCloud(inputFiles);

            usuarioActual.puntos[paradasVisitandoIndex].estado = "completado";
            usuarioActual.puntos[paradasVisitandoIndex].fotos = fotosUrls;
            usuarioActual.puntos[paradasVisitandoIndex].avance = document.getElementById("input-avance").value || "Visita completada";
            
            asesoresDB[usuarioActual.id] = usuarioActual;
            await guardarEnSupabase();
            cerrarModalVisita(); renderizarListaParadas(); actualizarDibujoRutaMapa();
            alert("Visita y fotos guardadas con éxito en la nube");
        }

        async function marcarIncidenciaAusente() {
            if (paradasVisitandoIndex === null) return;
            usuarioActual.puntos[paradasVisitandoIndex].estado = "ausente";
            usuarioActual.puntos[paradasVisitandoIndex].avance = "Cliente ausente / Sin novedad";
            asesoresDB[usuarioActual.id] = usuarioActual;
            await guardarEnSupabase();
            cerrarModalVisita(); renderizarListaParadas(); actualizarDibujoRutaMapa();
        }

        function abrirModalVisitaEmergente() { document.getElementById("modal-emergente").classList.remove("hidden"); }
        function cerrarModalEmergente() { document.getElementById("modal-emergente").classList.add("hidden"); }

        async function guardarVisitaEmergenteReal() {
            let nombre = document.getElementById("input-emergente-nombre").value.trim();
            let av = document.getElementById("input-emergente-avance").value.trim();
            let inputFiles = document.getElementById("input-fotos-emergente");
            
            if (!nombre) { alert("Ingrese el nombre del cliente"); return; }
            if (!usuarioActual.lat) { alert("Esperando señal de GPS..."); return; }

            let fotosUrls = await subirFotosAlCloud(inputFiles);

            if (!usuarioActual.emergentes) usuarioActual.emergentes = [];
            usuarioActual.emergentes.push({ 
                lat: usuarioActual.lat, 
                lng: usuarioActual.lng, 
                cliente: nombre, 
                avance: av || "Visita emergente", 
                fotos: fotosUrls,
                fecha: new Date().toLocaleDateString() 
            });

            asesoresDB[usuarioActual.id] = usuarioActual;
            await guardarEnSupabase();
            cerrarModalEmergente(); renderizarListaParadas(); actualizarDibujoRutaMapa();
            alert("Emergente y fotos guardadas con éxito");
        }

        function abrirModalEvidencias() {
            let grid = document.getElementById("contenedor-grid-evidencias");
            let html = "";
            Object.values(asesoresDB).forEach(usr => {
                if(usr.puntos) usr.puntos.forEach(p => { 
                    if(p.estado !== "pendiente") {
                        let imgHtml = "";
                        (p.fotos || []).forEach(url => { imgHtml += `<a href="${url}" target="_blank"><img src="${url}" class="w-16 h-16 object-cover rounded border shadow-sm"></a>`; });
                        html += `<div class="p-3 border rounded bg-slate-50 space-y-1"><b>${usr.nombre} - ${p.cliente}</b> (${p.estado})<br><span class="text-slate-600">${p.avance}</span><div class="flex gap-2 flex-wrap mt-1">${imgHtml}</div></div>`; 
                    }
                });
                if(usr.emergentes) usr.emergentes.forEach(em => { 
                    let imgHtml = "";
                    (em.fotos || []).forEach(url => { imgHtml += `<a href="${url}" target="_blank"><img src="${url}" class="w-16 h-16 object-cover rounded border shadow-sm"></a>`; });
                    html += `<div class="p-3 border rounded bg-blue-50 space-y-1"><b>⚡ ${usr.nombre} - ${em.cliente} (Emergencia)</b><br><span class="text-slate-600">${em.avance}</span><div class="flex gap-2 flex-wrap mt-1">${imgHtml}</div></div>`; 
                });
            });
            grid.innerHTML = html || "Sin registros o evidencias para el día de hoy.";
            document.getElementById("modal-evidencias").classList.remove("hidden");
        }
        function cerrarModalEvidencias() { document.getElementById("modal-evidencias").classList.add("hidden"); }
    </script>
</body>
</html>
